<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GammaDose — Error</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f2342; --blue: #1a56b0; --border: #e2e8f0;
      --bg: #f8fafc; --muted: #94a3b8; --slate: #475569;
    }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: #1e293b;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: var(--navy); padding: 0 2.5rem; height: 60px;
      display: flex; align-items: center;
    }
    .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
    .logo-mark {
      width: 32px; height: 32px; background: var(--blue); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; font-weight: 800; color: white;
    }
    .logo-text { color: white; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
    .logo-text span { color: var(--muted); font-weight: 400; margin-left: 0.35rem; font-size: 0.8rem; }

    main {
      flex: 1; display: flex; align-items: center;
      justify-content: center; padding: 3rem 1rem;
    }
    .card {
      background: white; border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
      padding: 2.25rem 2rem; width: 100%; max-width: 540px;
    }
    .error-icon {
      width: 48px; height: 48px; background: #fee2e2; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; margin-bottom: 1rem;
    }
    h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; color: #991b1b; }
    .message {
      font-size: 0.875rem; color: var(--slate);
      line-height: 1.6; margin-bottom: 1.25rem;
    }
    .suggestions {
      background: var(--bg); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1.5rem;
    }
    .suggestions p {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.5rem;
    }
    .suggestions ul { list-style: none; padding: 0; }
    .suggestions li {
      font-size: 0.82rem; color: var(--slate); padding: 0.2rem 0;
      padding-left: 1rem; position: relative; line-height: 1.5;
    }
    .suggestions li::before { content: "→"; position: absolute; left: 0; color: var(--muted); }
    .btn {
      display: inline-block; padding: 0.72rem 1.4rem;
      background: var(--blue); color: white; border-radius: 8px;
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
    }
    .btn:hover { background: #1648a0; }
    footer {
      background: var(--navy); color: var(--muted);
      text-align: center; padding: 1.25rem; font-size: 0.78rem;
    }
  </style>
</head>
<body>
<header>
  <a class="logo" href="/">
    <div class="logo-mark">&#947;</div>
    <div class="logo-text">GammaDose <span>by GammaMetric</span></div>
  </a>
</header>
<main>
  <div class="card">
    <div class="error-icon">&#9888;</div>
    <h2>{{ title }}</h2>
    <p class="message">{{ message }}</p>
    {% if suggestions %}
    <div class="suggestions">
      <p>How to fix this</p>
      <ul>
        {% for s in suggestions %}<li>{{ s }}</li>{% endfor %}
      </ul>
    </div>
    {% endif %}
    <a class="btn" href="/">&#8592; &nbsp;Try again</a>
  </div>
</main>
<footer>&copy; 2026 GammaMetric &mdash; Daniel Soliman, MS</footer>
</body>
</html>
